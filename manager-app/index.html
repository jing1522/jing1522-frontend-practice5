<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的课程表</title>
  <style>
   * { box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 480px; margin: 24px auto; padding: 0 16px; }
    li.done { text-decoration: line-through; color: #999; }
    .del { margin-left: 12px; cursor: pointer; }
    .tip { color: #c00; font-size: 14px; min-height: 20px; }
    .filters { margin: 12px 0; }
    .filters button { margin-right: 8px; }
  </style>
</head>
<body>
  <h1>我的课程表</h1>

  <form id="course-form">
    <input type="text" id="name-input" placeholder="课程名">
    <input type="text" id="teacher-input" placeholder="教师">
    <select id="day-select">
      <option value="周一">周一</option>
      <option value="周二">周二</option>
      <option value="周三">周三</option>
      <option value="周四">周四</option>
      <option value="周五">周五</option>
      <option value="周六">周六</option>
      <option value="周日">周日</option>
    </select>
    <select id="period-select">
      <option value="1-2节">1-2节</option>
      <option value="3-4节">3-4节</option>
      <option value="5-6节">5-6节</option>
      <option value="7-8节">7-8节</option>
      <option value="9-10节">9-10节</option>
    </select>
    <input type="text" id="room-input" placeholder="地点">
    <button type="submit" id="submit-btn">添加课程</button>
  </form>
  <p class="tip" id="tip"></p>

  <table>
    <thead>
      <tr>
        <th>课程名</th>
        <th>教师</th>
        <th>星期</th>
        <th>节次</th>
        <th>地点</th>
      </tr>
    </thead>
    <tbody id="course-list"></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
